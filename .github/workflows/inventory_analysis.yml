name: Inventory analysis
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/**'
      - 'analyze.py'
      - '.github/workflows/inventory_analysis.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pandas polars openpyxl
      - name: Analyze inventory exports
        run: python analyze.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: inventory-analysis-reports
          path: reports/
          if-no-files-found: error
